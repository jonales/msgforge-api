services:
  jarzap:
    build: .
    image: jarzap-api:dev
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jarzap
      CACHE_REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jarzap
      POSTGRES_USER: jarzap
      POSTGRES_PASSWORD: jarzap
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarzap"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

volumes:
  pg_data:
  redis_data:
