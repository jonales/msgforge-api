<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{manager/fragments/layout :: head(#{manager.instances.title})}"></head>
<body>
<header th:replace="~{manager/fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{manager/fragments/layout :: flash}"></div>
    <p class="flash success" th:if="${deletedName}" th:text="#{manager.flash.deletedName(${deletedName})}"></p>

    <div class="page-head">
        <h1 th:text="#{manager.instances.title}">Instâncias</h1>
        <a class="button primary" th:href="@{/manager/instances/new}" th:text="#{manager.instances.new}">Nova instância</a>
    </div>

    <section class="card">
        <!-- Ao vivo pelo SSE (evento "table"); o polling de 5 s é a reserva (manager.js) -->
        <div hx-ext="sse" th:attr="sse-connect=@{/manager/stream/instances}">
        <div th:fragment="table" id="instances-table" sse-swap="table" data-poll
             th:attr="hx-get=@{/manager/instances/table}" hx-trigger="every 5s" hx-swap="outerHTML">
            <p class="muted" th:if="${#lists.isEmpty(instances)}" th:text="#{manager.instances.empty}">Nenhuma</p>
            <table th:unless="${#lists.isEmpty(instances)}">
                <thead>
                <tr>
                    <th th:text="#{manager.col.name}">Nome</th>
                    <th th:text="#{manager.col.state}">Estado</th>
                    <th th:text="#{manager.col.number}">Número</th>
                    <th th:text="#{manager.col.profile}">Perfil</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${instances}">
                    <td><a th:href="@{/manager/instances/{n}(n=${row.name})}" th:text="${row.name}">vendas</a></td>
                    <!-- Nunca conectada: "Aguardando conexão" no lugar de Conectando/Desconectada; o estado
                         de fato fica em data-state -->
                    <td><span th:class="'badge ' + ${row.badge()}" th:data-state="${row.state}"
                              th:text="#{'manager.state.' + ${row.badge()}}">open</span></td>
                    <td th:text="${row.number} ?: '—'">5561...</td>
                    <td th:text="${row.profileName} ?: '—'">Fulano</td>
                </tr>
                </tbody>
            </table>
        </div>
        </div>
    </section>
</main>
</body>
</html>
