<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Sem o <style> que o htmx injeta: o CSP só aceita CSS de arquivo ('self'). Sem cópia da página
         no histórico do htmx: voltar para uma URL empurrada (a conversa aberta) recarrega do servidor. -->
    <meta name="htmx-config" content='{"includeIndicatorStyles": false, "historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
    <title th:text="${title} + ' · ' + #{manager.brand}">Msgforge</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/manager/favicon.svg}">
    <link rel="stylesheet" th:href="@{/manager/manager.css}">
    <script th:src="@{/manager/vendor/htmx-2.0.11.min.js}" defer></script>
    <!-- Tempo real (ADR 0013): extensão sse do htmx e a queda para o polling -->
    <script th:src="@{/manager/vendor/htmx-ext-sse-2.2.4.min.js}" defer></script>
    <script th:src="@{/manager/manager.js}" defer></script>
</head>
<body>

<!-- Quem está logado, "Usuários" (para quem gerencia usuários) e "Sair", à direita (ADR 0010) -->
<header th:fragment="header" class="topbar" th:with="me=${@managerTopbar.view()}">
    <a class="brand" th:href="@{/manager}" th:text="#{manager.brand}">Msgforge</a>
    <span class="brand-sub" th:text="#{manager.subtitle}">Manager</span>
    <nav class="topbar-account" th:attr="aria-label=#{manager.topbar.account}">
        <span class="topbar-who" th:text="${me.email} ?: #{manager.topbar.globalKey}">ana@exemplo.com</span>
        <a class="topbar-link" th:if="${me.users}" th:href="@{/manager/users}" th:text="#{manager.topbar.users}">Usuários</a>
        <a class="topbar-link" th:if="${me.server}" th:href="@{/manager/server}" th:text="#{manager.nav.server}"
           th:attr="aria-current=${currentPage == 'server'} ? 'page' : null">Servidor</a>
        <!-- Tema: Sistema, Claro ou Escuro. Um POST comum grava o cookie e volta para esta página -->
        <details class="theme-menu" th:with="theme=${@managerTheme.choice()}">
            <summary class="topbar-link">
                <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 16 16" width="16" height="16">
                    <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/>
                </svg>
                <span class="theme-word" th:text="#{manager.theme.label}">Tema</span>
                <span class="visually-hidden" th:text="': ' + #{'manager.theme.' + ${theme.value()}}">: Sistema</span>
            </summary>
            <form class="theme-options" th:action="@{/manager/theme}" method="post">
                <input type="hidden" name="back" th:value="${@managerTheme.back()}">
                <p class="theme-title" id="theme-title" th:text="#{manager.theme.choose}">Tema do Manager</p>
                <div role="group" aria-labelledby="theme-title">
                    <button type="submit" name="theme" class="theme-option" th:each="option : ${@managerTheme.choices()}"
                            th:value="${option.value()}" th:attr="aria-pressed=${option == theme}">
                        <span th:text="#{'manager.theme.' + ${option.value()}}">Sistema</span>
                        <span class="theme-hint small" th:text="#{'manager.theme.' + ${option.value()} + '.hint'}">Segue o aparelho</span>
                    </button>
                </div>
            </form>
        </details>
        <form class="topbar-logout" th:action="@{/manager/logout}" method="post">
            <button type="submit" class="link" th:text="#{manager.signOut}">Sair</button>
        </form>
    </nav>
</header>

<!-- Indicador da nova instância guiada. Os passos já feitos viram links enquanto dá para voltar
     (antes de criar); o atual leva aria-current="step". -->
<nav th:fragment="steps(current, total, linkBack)" class="steps" th:attr="aria-label=#{manager.wizard.progress}">
    <p class="steps-count" id="steps-count" th:text="#{manager.wizard.stepOf(${current}, ${total})}">Passo 1 de 4</p>
    <ol>
        <li th:each="i : ${#numbers.sequence(1, total)}"
            th:with="href=${i == 1} ? @{/manager/instances/new} : (${i == 2} ? @{/manager/instances/new/connection} : @{/manager/instances/new/history})"
            th:class="${i < current} ? 'done' : (${i == current} ? 'current' : 'todo')"
            th:attr="aria-current=${i == current} ? 'step' : null">
            <a th:if="${linkBack and i < current}" th:href="${href}">
                <span class="step-mark" aria-hidden="true" th:text="${i}">1</span>
                <span th:text="#{'manager.wizard.step.' + ${i}}">Nome</span>
                <span class="visually-hidden" th:text="'(' + #{manager.wizard.done} + ')'">(concluído)</span>
            </a>
            <span class="step-item" th:unless="${linkBack and i < current}">
                <span class="step-mark" aria-hidden="true" th:text="${i}">1</span>
                <span th:text="#{'manager.wizard.step.' + ${i}}">Nome</span>
                <span class="visually-hidden" th:if="${i < current}" th:text="'(' + #{manager.wizard.done} + ')'">(concluído)</span>
            </span>
        </li>
    </ol>
</nav>

<!-- Trilha das telas do painel: "Instâncias / nome / Tela". Na visão geral (current nulo), o nome é a
     página atual. -->
<nav th:fragment="panelCrumbs(name, current)" class="breadcrumb" th:attr="aria-label=#{manager.breadcrumb.label}">
    <a th:href="@{/manager}" th:text="#{manager.breadcrumb.instances}">Instâncias</a>
    <span aria-hidden="true">/</span>
    <span th:if="${current == null}" aria-current="page" th:text="${name}">vendas</span>
    <th:block th:if="${current != null}">
        <a th:href="@{/manager/instances/{n}(n=${name})}" th:text="${name}">vendas</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page" th:text="#{${current}}">Conexão</span>
    </th:block>
</nav>

<!-- Menu do painel da instância: cada item é uma tela própria (URL própria; voltar e recarregar
     funcionam) e o atual leva aria-current="page". Só os itens que a pessoa pode abrir (PanelAccess);
     a rota confere de novo. No celular, vira uma faixa de abas numa linha só, que rola dentro dela
     mesma (a página não rola para o lado). -->
<nav th:fragment="panelNav(name, can, current)" class="panel-nav" th:attr="aria-label=#{manager.panelNav.label}">
    <ul>
        <li><a th:href="@{/manager/instances/{n}(n=${name})}" th:attr="aria-current=${current == 'overview'} ? 'page' : null"
               th:text="#{manager.panelNav.overview}">Visão geral</a></li>
        <li><a th:href="@{/manager/instances/{n}/connection(n=${name})}" th:attr="aria-current=${current == 'connection'} ? 'page' : null"
               th:text="#{manager.panelNav.connection}">Conexão</a></li>
        <li th:if="${can.chats}"><a th:href="@{/manager/instances/{n}/messages(n=${name})}" th:attr="aria-current=${current == 'messages'} ? 'page' : null"
               th:text="#{manager.panelNav.messages}">Mensagens</a></li>
        <li th:if="${can.send}"><a th:href="@{/manager/instances/{n}/send(n=${name})}" th:attr="aria-current=${current == 'send'} ? 'page' : null"
               th:text="#{manager.panelNav.send}">Envio de teste</a></li>
        <!-- Uma tela por grupo (chamadas, leitura, presença, histórico, proxy, webhook) -->
        <li th:if="${can.settings()}"><a th:href="@{/manager/instances/{n}/settings(n=${name})}" th:attr="aria-current=${current == 'settings'} ? 'page' : null"
               th:text="#{manager.panelNav.settings}">Configurações</a></li>
        <!-- Tela própria por instância; as integrações ainda não funcionam (marca "Em breve") -->
        <li class="panel-nav-soon"><a th:href="@{/manager/instances/{n}/integrations(n=${name})}"
               th:attr="aria-current=${current == 'integrations'} ? 'page' : null">
            <span th:text="#{manager.panelNav.integrations}">Integrações</span>
            <span class="soon-tag tag" th:text="#{manager.soon.tag}">Em breve</span>
        </a></li>
    </ul>
</nav>

<div th:fragment="flash">
    <div class="flash success" role="status" th:if="${success}" th:text="#{${success}}">ok</div>
    <div class="flash error" role="alert" th:if="${error}" th:text="#{${error}}">erro</div>
    <div class="flash error" role="alert" th:if="${errorText}" th:text="${errorText}">erro</div>
</div>

</body>
</html>
