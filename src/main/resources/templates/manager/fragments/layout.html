<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Sem o <style> que o htmx injeta: o CSP só aceita CSS de arquivo ('self') -->
    <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
    <title th:text="${title} + ' · ' + #{manager.brand}">Msgforge</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/manager/favicon.svg}">
    <link rel="stylesheet" th:href="@{/manager/manager.css}">
    <script th:src="@{/manager/vendor/htmx-2.0.11.min.js}" defer></script>
    <!-- Tempo real (ADR 0013): extensão sse do htmx e a queda para o polling -->
    <script th:src="@{/manager/vendor/htmx-ext-sse-2.2.4.min.js}" defer></script>
    <script th:src="@{/manager/manager.js}" defer></script>
</head>
<body>

<!-- Quem está logado, "Usuários" (para quem gerencia usuários) e "Sair", à direita (ADR 0010) -->
<header th:fragment="header" class="topbar" th:with="me=${@managerTopbar.view()}">
    <a class="brand" th:href="@{/manager}" th:text="#{manager.brand}">Msgforge</a>
    <span class="brand-sub" th:text="#{manager.subtitle}">Manager</span>
    <nav class="topbar-account" th:attr="aria-label=#{manager.topbar.account}">
        <span class="topbar-who" th:text="${me.email} ?: #{manager.topbar.globalKey}">ana@exemplo.com</span>
        <a class="topbar-link" th:if="${me.users}" th:href="@{/manager/users}" th:text="#{manager.topbar.users}">Usuários</a>
        <form class="topbar-logout" th:action="@{/manager/logout}" method="post">
            <button type="submit" class="link" th:text="#{manager.signOut}">Sair</button>
        </form>
    </nav>
</header>

<!-- Indicador da nova instância guiada. Os passos já feitos viram links enquanto dá para voltar
     (antes de criar); o atual leva aria-current="step". -->
<nav th:fragment="steps(current, total, linkBack)" class="steps" th:attr="aria-label=#{manager.wizard.progress}">
    <p class="steps-count" id="steps-count" th:text="#{manager.wizard.stepOf(${current}, ${total})}">Passo 1 de 4</p>
    <ol>
        <li th:each="i : ${#numbers.sequence(1, total)}"
            th:with="href=${i == 1} ? @{/manager/instances/new} : (${i == 2} ? @{/manager/instances/new/connection} : @{/manager/instances/new/history})"
            th:class="${i < current} ? 'done' : (${i == current} ? 'current' : 'todo')"
            th:attr="aria-current=${i == current} ? 'step' : null">
            <a th:if="${linkBack and i < current}" th:href="${href}">
                <span class="step-mark" aria-hidden="true" th:text="${i}">1</span>
                <span th:text="#{'manager.wizard.step.' + ${i}}">Nome</span>
                <span class="visually-hidden" th:text="'(' + #{manager.wizard.done} + ')'">(concluído)</span>
            </a>
            <span class="step-item" th:unless="${linkBack and i < current}">
                <span class="step-mark" aria-hidden="true" th:text="${i}">1</span>
                <span th:text="#{'manager.wizard.step.' + ${i}}">Nome</span>
                <span class="visually-hidden" th:if="${i < current}" th:text="'(' + #{manager.wizard.done} + ')'">(concluído)</span>
            </span>
        </li>
    </ol>
</nav>

<div th:fragment="flash">
    <div class="flash success" role="status" th:if="${success}" th:text="#{${success}}">ok</div>
    <div class="flash error" role="alert" th:if="${error}" th:text="#{${error}}">erro</div>
    <div class="flash error" role="alert" th:if="${errorText}" th:text="${errorText}">erro</div>
</div>

</body>
</html>
