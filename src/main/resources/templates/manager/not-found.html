<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Instância que não existe ou que a pessoa não vê: a mesma página (404) nos dois casos. -->
<head th:replace="~{manager/fragments/layout :: head(#{manager.notFound.title})}"></head>
<body>
<header th:replace="~{manager/fragments/layout :: header}"></header>
<main class="container access-page">
    <h1 th:text="#{manager.notFound.title}">Instância não encontrada</h1>
    <p class="muted" th:text="#{manager.notFound.hint}">Ela não existe ou não está entre as suas.</p>
    <p><a class="button" th:href="@{/manager}" th:text="#{manager.back}">← Instâncias</a></p>
</main>
</body>
</html>
