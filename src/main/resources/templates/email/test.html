<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- E-mail de teste (EmailRenderer). Estilo inline de propósito: cliente de e-mail não lê CSS
     externo, e o CSP do Manager não vale para e-mail. Layout em tabela, que todo cliente entende. -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">E-mail de teste</title>
</head>
<body style="margin:0;padding:0;background:#f6f7f9;color:#1d2330;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f9;">
    <tr>
        <td align="center" style="padding:24px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px;background:#ffffff;border:1px solid #dde1e8;border-radius:10px;">
                <tr>
                    <td style="padding:20px 24px 0;font-weight:700;font-size:15px;color:#1d2330;" th:text="#{email.brand}">Msgforge</td>
                </tr>
                <tr>
                    <td style="padding:12px 24px 0;">
                        <h1 style="margin:0;font-size:20px;line-height:1.3;color:#1d2330;" th:text="#{email.test.heading}">Funcionando</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:12px 24px 24px;font-size:15px;line-height:1.5;color:#1d2330;">
                        <p style="margin:0;" th:text="#{email.test.body}">Corpo.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 24px;border-top:1px solid #dde1e8;font-size:13px;line-height:1.5;color:#5d6677;"
                        th:text="#{email.test.footer}">Rodapé.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
