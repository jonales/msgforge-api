server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        # Atrás de HTTPS, ligue também: SERVER_SERVLET_SESSION_COOKIE_SECURE=true

spring:
  application:
    name: msgforge-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/msgforge}
    username: ${DATABASE_USER:msgforge}
    password: ${DATABASE_PASSWORD:msgforge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Padrão de migrations: docs/MIGRATIONS.md
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
  data:
    redis:
      host: ${CACHE_REDIS_HOST:localhost}
      port: ${CACHE_REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Nomes inspirados nas variáveis da Evolution API para facilitar a migração do .env
msgforge:
  server-url: ${SERVER_URL:http://localhost:8080}
  authentication:
    api-key: ${AUTHENTICATION_API_KEY:troque-esta-chave}
  webhook:
    global-url: ${WEBHOOK_GLOBAL_URL:}
    global-enabled: ${WEBHOOK_GLOBAL_ENABLED:false}
    request-timeout-ms: ${WEBHOOK_REQUEST_TIMEOUT_MS:10000}
    retry:
      max-attempts: ${WEBHOOK_RETRY_MAX_ATTEMPTS:5}
      initial-delay-ms: ${WEBHOOK_RETRY_INITIAL_DELAY_MS:1000}
      max-delay-ms: ${WEBHOOK_RETRY_MAX_DELAY_MS:30000}
    max-pending-per-instance: ${WEBHOOK_MAX_PENDING_PER_INSTANCE:1000}
    block-private-networks: ${WEBHOOK_BLOCK_PRIVATE_NETWORKS:false}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
    exchange: ${RABBITMQ_EXCHANGE_NAME:msgforge_exchange}
  gateway: ${MSGFORGE_GATEWAY:stub}
  cobalt:
    device-name: ${CONFIG_SESSION_PHONE_CLIENT:Msgforge}
    qr-wait-ms: ${COBALT_QR_WAIT_MS:10000}
    send-timeout-ms: ${COBALT_SEND_TIMEOUT_MS:30000}
    media-max-bytes: ${COBALT_MEDIA_MAX_BYTES:67108864}
    proxy: ${COBALT_PROXY:}

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /docs
