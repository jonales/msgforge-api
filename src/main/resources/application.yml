server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: jarzap-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jarzap}
    username: ${DATABASE_USER:jarzap}
    password: ${DATABASE_PASSWORD:jarzap}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${CACHE_REDIS_HOST:localhost}
      port: ${CACHE_REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Nomes inspirados nas variáveis da Evolution API para facilitar a migração do .env
jarzap:
  server-url: ${SERVER_URL:http://localhost:8080}
  authentication:
    api-key: ${AUTHENTICATION_API_KEY:troque-esta-chave}
  webhook:
    global-url: ${WEBHOOK_GLOBAL_URL:}
    global-enabled: ${WEBHOOK_GLOBAL_ENABLED:false}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
    exchange: ${RABBITMQ_EXCHANGE_NAME:jarzap_exchange}
  gateway: ${JARZAP_GATEWAY:stub}

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /docs
